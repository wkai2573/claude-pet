[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-pet"
dynamic = ["version"]  # 版本號只在 claude_pet/__init__.py 定義一處
description = "A hand-drawn desktop pet for Windows that follows what Claude Code is doing, and lets you chat with Claude."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = ["pillow>=9.2"]
keywords = ["claude", "claude-code", "desktop-pet", "tkinter"]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Environment :: Win32 (MS Windows)",
    "Topic :: Desktop Environment",
]

[project.scripts]
claude-pet = "claude_pet.cli:main"

[project.urls]
Homepage = "https://github.com/wkai2573/claude-pet"
Issues = "https://github.com/wkai2573/claude-pet/issues"

[tool.setuptools]
packages = ["claude_pet"]

[tool.setuptools.dynamic]
version = { attr = "claude_pet.__version__" }
